<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chương 1 — Đêm không trăng</title><style>

@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Playfair+Display:wght@700&display=swap');
:root{--gold:#ffd67d;--night:#080b22;--cream:#fff5e5}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--night);color:var(--cream);font-family:'Be Vietnam Pro',sans-serif}button{font:inherit;cursor:pointer;color:inherit}
#film{height:100%;position:relative;overflow:hidden;background:radial-gradient(circle at 72% 18%,#394078,#141a3d 45%,#07091a 100%);transition:background 1.2s}.sky{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1px),radial-gradient(#ffe9ae 1px,transparent 1px);background-size:77px 77px,137px 137px;background-position:12px 18px,47px 62px;opacity:.65}.moon{position:absolute;right:12%;top:12%;width:clamp(120px,20vw,230px);height:clamp(120px,20vw,230px);border-radius:50%;background:radial-gradient(circle at 30% 28%,#fffef2,#ffe7a4 68%,#eeb566);box-shadow:0 0 50px #fff0b0,0 0 130px #ffd77777;animation:float 5s ease-in-out infinite;transition:all 1.2s}.moon:after{content:"";position:absolute;width:22%;height:12%;left:26%;top:25%;border-radius:50%;background:#d9b37455;box-shadow:55px 50px 0 8px #d9b37433,20px 92px 0 4px #d9b37444}.village{position:absolute;inset:58% 0 0;background:#080b20;transition:all 1.3s}.house{position:absolute;bottom:17%;width:160px;height:88px;background:#12152f}.house:before{content:"";position:absolute;left:-25px;top:-45px;border-left:105px solid transparent;border-right:105px solid transparent;border-bottom:57px solid #1a1d3b}.house:after{content:"";position:absolute;left:70px;top:35px;width:19px;height:27px;background:#ffcb67;box-shadow:0 0 25px #ffbc4c}.h1{left:4%}.h2{left:37%;transform:scale(.7)}.h3{right:4%;transform:scale(1.1)}
.characters{position:absolute;left:12%;bottom:16%;display:flex;gap:25px;align-items:flex-end;z-index:8;transition:all 1.2s}.person{text-align:center;position:relative;filter:drop-shadow(0 8px 5px #0008)}.person .body{font-size:clamp(4rem,8vw,7rem);display:block}.person small{font-size:.72rem;background:#080a20cc;border:1px solid #fff3;border-radius:20px;padding:4px 10px}.rabbit{display:none}.bubble{position:absolute;left:50%;bottom:calc(100% + 20px);transform:translateX(-50%) scale(.8);width:max-content;max-width:260px;padding:12px 15px;border-radius:18px 18px 18px 4px;background:#fff8e9;color:#25182c;border:2px solid #ffd67d;line-height:1.45;font-size:.85rem;opacity:0;transition:.45s;pointer-events:none}.bubble:after{content:"";position:absolute;left:27px;bottom:-10px;border:10px solid transparent;border-top-color:#fff8e9;border-bottom:0}.bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
.obj{position:absolute;z-index:6;opacity:0;pointer-events:none}.lantern{font-size:3rem;filter:drop-shadow(0 0 17px #ffad4d)}.drum{font-size:3.4rem}.lion{font-size:clamp(4rem,8vw,7rem)}.child{font-size:clamp(3.5rem,7vw,6rem)}.leaves{font-size:2.8rem}.glow{width:7px;height:7px;border-radius:50%;background:#ffe29a;box-shadow:0 0 20px 7px #ffd77d}.silence{font-size:5rem;color:#8790c9}.path{height:5px;width:0;border-radius:9px;background:linear-gradient(90deg,#ffe29a,#fff);box-shadow:0 0 18px 8px #ffd77d;left:10%;bottom:15%;transform-origin:left}
.frame{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .9s}.frame.active{opacity:1}.frame-0 .lantern,.frame-0 .drum,.frame-0 .lion,.frame-0 .child{opacity:1}.frame-0 .lion{left:8%;bottom:28%;animation:lion 2s ease-in-out infinite}.frame-0 .drum{left:23%;bottom:26%;animation:beat 1s ease-in-out infinite}.frame-0 .child{left:45%;bottom:20%;animation:hop 2.2s ease-in-out infinite}.frame-0 .lantern{left:34%;top:25%;animation:sway 2.5s ease-in-out infinite}.frame-1 .lantern,.frame-1 .child{opacity:1}.frame-1 .lantern{left:37%;top:20%;animation:pulse 1.5s ease-in-out infinite}.frame-1 .child{left:42%;bottom:19%;animation:wave 2s ease-in-out infinite}.frame-2 .lantern,.frame-2 .glow{opacity:1}.frame-2 .lantern{left:37%;top:22%;animation:lightUp 1.8s ease-in-out infinite}.frame-2 .glow{left:48%;top:46%;animation:drift 2.5s ease-in-out infinite}.frame-3 .silence{opacity:1;left:50%;top:27%;animation:drop 1.4s ease both}.frame-3 .moon{opacity:0;transform:translate(180px,-100px) scale(.18)}.frame-3 .lantern,.frame-3 .drum,.frame-3 .lion,.frame-3 .child{opacity:.1;filter:grayscale(1)}.frame-4 .silence{opacity:1;left:50%;top:27%;animation:heartbeat 1.4s ease-in-out infinite}.frame-4 .child{opacity:1;left:45%;bottom:19%;animation:stagger 1.2s ease both}.frame-5 .leaves,.frame-5 .glow,.frame-5 .path{opacity:1}.frame-5 .leaves{left:-5%;top:27%;animation:leaf 3.2s ease-in-out infinite}.frame-5 .glow{left:20%;bottom:17%;animation:lead 2.4s ease-in-out infinite}.frame-5 .path{animation:drawPath 2.4s ease forwards}.frame-5 .child{opacity:1;left:43%;bottom:18%;animation:walk 2.5s ease-in-out infinite}
.top{position:absolute;z-index:30;top:18px;left:22px;right:22px;display:flex;justify-content:space-between;color:var(--gold);font-size:.75rem;letter-spacing:.14em;font-weight:700}.bar{position:absolute;z-index:30;left:22px;right:22px;top:53px;height:3px;background:#fff2}.bar i{display:block;height:100%;width:0;background:var(--gold);transition:.6s}.caption{position:absolute;z-index:20;left:50%;bottom:7%;transform:translateX(-50%);width:min(880px,92vw);text-align:center;font-size:clamp(1rem,2.2vw,1.3rem);line-height:1.65;min-height:80px;padding:16px 25px;background:linear-gradient(90deg,transparent,#020415e8 15%,#020415ed 50%,#020415e8 85%,transparent)}.cursor{display:inline-block;width:2px;height:1.2em;background:var(--gold);vertical-align:middle;animation:blink .7s infinite}.next{position:absolute;z-index:30;right:24px;bottom:24px;border:1px solid #fff5;background:#101431dd;border-radius:999px;padding:10px 16px}.start,.finish{position:absolute;z-index:60;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 65% 22%,#3a407d,#111633 45%,#07091a);transition:opacity .8s}.start.hide{opacity:0;pointer-events:none}.card{width:min(700px,90vw)}h1,h2{font-family:'Playfair Display',serif;color:var(--gold)}h1{font-size:clamp(3.5rem,9vw,7rem);line-height:.9;margin:22px 0}.card p{color:#d9d0dc;line-height:1.8}.primary{border:0;border-radius:99px;padding:14px 24px;background:linear-gradient(100deg,#ffd77d,#ff9d79);color:#25152a;font-weight:700}.finish{display:none}.finish.show{display:grid}.finish h2{font-size:clamp(3rem,8vw,6rem);margin:0}.finish input{padding:13px 16px;border-radius:99px;border:1px solid #fff4;background:#080b20;color:#fff;width:min(360px,80vw);margin:20px 5px 10px}
@keyframes float{50%{transform:translateY(-12px)}}@keyframes lion{50%{transform:translateX(18px) rotate(3deg)}}@keyframes beat{50%{transform:scale(1.13) rotate(-5deg)}}@keyframes hop{50%{transform:translateY(-16px)}}@keyframes sway{50%{transform:rotate(10deg) translateY(-8px)}}@keyframes pulse{50%{filter:drop-shadow(0 0 50px #ffd06a) brightness(1.7)}}@keyframes wave{50%{transform:rotate(9deg) translateY(-6px)}}@keyframes lightUp{50%{transform:scale(1.2);filter:drop-shadow(0 0 55px #ffb55a) brightness(1.7)}}@keyframes drift{50%{transform:translate(80px,-30px) scale(2)}}@keyframes drop{from{transform:translateY(-80px);opacity:0}to{transform:translateY(0);opacity:.8}}@keyframes heartbeat{50%{transform:scale(1.2);filter:drop-shadow(0 0 25px #95a0ff)}}@keyframes stagger{40%{transform:translateX(-12px)}70%{transform:translateX(3px)}}@keyframes leaf{50%{transform:translate(70vw,20vh) rotate(220deg)}}@keyframes lead{50%{transform:translate(22vw,-8vh) scale(1.7)}}@keyframes drawPath{to{width:75vw}}@keyframes walk{50%{transform:translateX(38px)}}@keyframes blink{50%{opacity:0}}
@media(max-width:650px){.characters{left:4%;bottom:19%;gap:8px}.bubble{max-width:210px;font-size:.75rem}.house{transform:scale(.65)}.h3{transform:scale(.65)}.caption{bottom:10%;padding:12px 10px}.next{bottom:18px;right:16px}}


</style>
</head><body><main id="film"><div class="sky"></div><div class="moon"></div><div class="village"><i class="house h1"></i><i class="house h2"></i><i class="house h3"></i></div><div class="top">✦ TRUNG THU · CHƯƠNG 1 <span id="sceneNo">1 / 6</span></div><div class="bar"><i id="bar"></i></div><div class="characters"><div class="person an"><span class="body">👧🏻</span><small>An</small></div><div class="person rabbit"><span class="body">🐇</span><small>Thỏ Ngọc</small></div></div><div id="frames"><div class="frame frame-0"><i class="obj lion">🦁</i><i class="obj drum">🥁</i><i class="obj child">🧒🏻</i><i class="obj lantern">🏮</i></div><div class="frame frame-1"><i class="obj lantern">🏮</i><i class="obj child">🧒🏻</i></div><div class="frame frame-2"><i class="obj lantern">🏮</i><i class="obj glow"></i></div><div class="frame frame-3"><i class="obj silence">◌</i></div><div class="frame frame-4"><i class="obj silence">◌</i><i class="obj child">🧒🏻</i></div><div class="frame frame-5"><i class="obj leaves">🍃</i><i class="obj glow"></i><i class="obj path"></i><i class="obj child">🧒🏻</i></div></div><div class="caption"><span id="caption"></span><i class="cursor"></i></div><section class="start" id="start"><div class="card"><div style="color:var(--gold);letter-spacing:.2em;font-size:.75rem">MỘT BỘ PHIM HOẠT HÌNH TƯƠNG TÁC</div><h1>Mặt Trăng<br>Bị Đánh Cắp</h1><p>Chương 1: Đêm không trăng. Mỗi câu là một frame riêng; hãy bấm để kể tiếp.</p><button class="primary" id="begin">Bắt đầu Chương 1</button></div></section><section class="finish" id="finish"><div class="card"><h2>Cánh cửa rừng tre mở ra</h2><p>An đã bước theo vệt sáng. Chương 2 sẽ bắt đầu từ đây.</p><button class="primary" onclick="location.reload()">Xem lại Chương 1</button></div></section></main>
<script>
(() => {
  const film = document.querySelector('#film');
  const start = document.querySelector('#start');
  const caption = document.querySelector('#caption');
  const captionBox = document.querySelector('.caption');
  const progress = document.querySelector('#bar');
  const sceneNo = document.querySelector('#sceneNo');
  const characters = document.querySelector('.characters');
  const an = document.querySelector('.an');
  const rabbit = document.querySelector('.rabbit');
  const frames = [...document.querySelectorAll('.frame')];
  const story = [
    ['Người kể chuyện','Mọi năm, cứ đến đêm rằm tháng Tám, mặt trăng lại treo trên ngọn tre đầu làng.'],
    ['Người kể chuyện','Đèn ông sao sáng đỏ những con ngõ. Tiếng trống lân chạy từ đầu làng đến tận bờ sông.'],
    ['An','Em sẽ để dành chiếc bánh đẹp nhất cho anh Hai. Năm nay anh nhất định sẽ về.'],
    ['Người kể chuyện','Nhưng đúng lúc tiếng trống vang lên lần thứ ba… bầu trời bỗng im bặt.'],
    ['An','Mặt trăng… biến mất rồi!'],
    ['Người kể chuyện','Những chiếc đèn lần lượt tắt. Trên mặt đất chỉ còn một đốm đom đóm dẫn về phía rừng tre.'],
    ['Người kể chuyện','An bước qua ranh giới của rừng tre. Sau lưng cô bé, con đường làng khép lại trong màn sương.'],
    ['Thỏ Ngọc','Khoan đã! Nếu cứ đi một mình, cậu sẽ bị những cái bóng dẫn lạc đường.'],
    ['An','Cậu từ đâu xuất hiện vậy? Và tại sao cậu biết mặt trăng đã biến mất?'],
    ['Thỏ Ngọc','Vì đó là nhà của mình. Ba mảnh trăng đã rơi xuống bên mặt hồ.'],
    ['Đom Đóm','Hãy đi theo tôi. Ánh sáng nhỏ vẫn có thể tìm đường trong một đêm rất tối.'],
    ['Người kể chuyện','Cuối rừng là một mặt hồ phẳng như gương. Dưới làn nước, một cánh cửa hình trăng khuyết đang ngủ.']
  ];
  let index=0, typing=false, text='', cursor=0, timer=null, started=false;
  const bubbleAn=document.createElement('div'), bubbleRabbit=document.createElement('div');
  bubbleAn.className=bubbleRabbit.className='bubble'; an.appendChild(bubbleAn); rabbit.appendChild(bubbleRabbit);
  /* Dựng lại riêng Chương 1: frame đầu chỉ có tre, làng và trăng */
  document.querySelectorAll('.frame-0 .lion,.frame-0 .drum,.frame-0 .child,.frame-0 .lantern').forEach(el=>el.remove());
  const tre=document.createElement('div');tre.className='tre-dau-lang';tre.innerHTML='<i></i><i></i><i></i><i></i><i></i><b></b><b></b><b></b><b></b><b></b>';film.insertBefore(tre,document.querySelector('#frames'));
  const f1=document.querySelector('.frame-1');f1.insertAdjacentHTML('afterbegin','<i class="obj lion second-lion">🦁</i><i class="obj drum second-drum">🥁</i>');
  document.querySelectorAll('.house').forEach(h=>{const lamp=document.createElement('i');lamp.className='home-lamp';lamp.textContent='🏮';h.appendChild(lamp)});
  document.head.insertAdjacentHTML('beforeend',`<style>.tre-dau-lang{position:absolute;z-index:5;right:13%;bottom:24%;width:240px;height:285px;opacity:1;filter:drop-shadow(0 8px 12px #0005)}.tre-dau-lang i{position:absolute;bottom:0;width:8px;height:100%;border-radius:10px;background:repeating-linear-gradient(to bottom,transparent 0 38px,#0a271f 39px 43px,transparent 44px 78px),linear-gradient(90deg,#0b3026,#529568,#173e2d)}.tre-dau-lang i:nth-child(2){left:39px;height:91%;transform:rotate(3deg)}.tre-dau-lang i:nth-child(3){left:78px;height:78%;transform:rotate(10deg)}.tre-dau-lang i:nth-child(4){left:122px;height:96%;transform:rotate(-5deg)}.tre-dau-lang i:nth-child(5){left:162px;height:73%;transform:rotate(8deg)}.tre-dau-lang b{position:absolute;width:58px;height:20px;border-radius:100% 0;background:linear-gradient(135deg,#367c4c,#205b3c);left:-15px;top:52px}.tre-dau-lang b:nth-of-type(2){left:38px;top:88px;transform:rotate(18deg)}.tre-dau-lang b:nth-of-type(3){left:83px;top:126px;transform:rotate(-20deg)}.tre-dau-lang b:nth-of-type(4){left:125px;top:58px;transform:rotate(22deg)}.tre-dau-lang b:nth-of-type(5){left:160px;top:152px;transform:rotate(-14deg)}.home-lamp{position:absolute;left:66%;top:-13px;transform:translateX(-50%);font-style:normal;font-size:19px;opacity:0;filter:drop-shadow(0 0 12px #ffb84e);animation:lampGlow 1.7s ease-in-out infinite}.frame-1 .second-lion,.frame-1 .second-drum{opacity:1}.second-lion{left:9%;bottom:28%;animation:lion 2s ease-in-out infinite}.second-drum{left:24%;bottom:26%;animation:beat 1s ease-in-out infinite}#film[data-story="0"] .characters,#film[data-story="1"] .characters{opacity:0}#film[data-story="2"] .characters,#film[data-story="3"] .characters,#film[data-story="4"] .characters,#film[data-story="5"] .characters{opacity:1}#film[data-story="1"] .home-lamp,#film[data-story="2"] .home-lamp,#film[data-story="3"] .home-lamp,#film[data-story="4"] .home-lamp{opacity:1}#film[data-story="5"] .home-lamp,#film[data-story="5"] .house:after{opacity:0!important}.frame-1 .lantern,.frame-2 .lantern{display:none}.frame-5 .leaves{display:none!important}</style>`);
  const extra=document.createElement('div');extra.className='c2-layer';extra.innerHTML='<i class="c2obj bamboo-wall">🎋</i><i class="c2obj rabbit-big">🐇</i><i class="c2obj clue">✦</i><i class="c2obj fly-a">✧</i><i class="c2obj fly-b">✦</i><i class="c2obj lake-ripple">◌</i><i class="c2obj moon-door">◐</i>';film.appendChild(extra);
  document.head.insertAdjacentHTML('beforeend',`<style>
  .bubble{position:absolute;left:50%;bottom:calc(100% + 18px);transform:translateX(-50%) scale(.8);width:max-content;max-width:250px;padding:11px 14px;border:2px solid #ffd67d;border-radius:18px 18px 18px 4px;background:#fff8e9;color:#25182c;line-height:1.45;font-size:.8rem;opacity:0;transition:.3s;z-index:20}.bubble:after{content:"";position:absolute;left:26px;bottom:-9px;border:9px solid transparent;border-top-color:#fff8e9}.bubble.show{opacity:1;transform:translateX(-50%) scale(1)}.caption{background:transparent!important}.c2-layer{position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;transition:opacity 1s}.c2obj{position:absolute;opacity:0}.chapter2-on .c2-layer{opacity:1}.chapter2-on .village{opacity:0}.bamboo-wall{right:5%;bottom:12%;font-size:clamp(8rem,22vw,18rem);animation:bamboo 3s ease-in-out infinite}.rabbit-big{left:47%;bottom:17%;font-size:clamp(4rem,9vw,7rem);animation:rabbit 2s ease-in-out infinite}.clue{left:30%;top:38%;font-size:3rem;color:#ffe18c;animation:spin 2.5s infinite}.fly-a{left:25%;top:35%;font-size:2.5rem;color:#fff0a1;animation:fly 2.8s infinite}.fly-b{left:53%;top:48%;font-size:2rem;color:#fff0a1;animation:fly 3.1s -1s infinite}.lake-ripple{left:51%;top:62%;font-size:9rem;color:#93aefc;animation:ripple 2.4s infinite}.moon-door{left:50%;top:43%;font-size:13rem;color:#ffd77d;animation:door 2.6s infinite}#film[data-story="6"] .bamboo-wall,#film[data-story="6"] .an{opacity:1}#film[data-story="7"] .bamboo-wall,#film[data-story="7"] .rabbit-big{opacity:1}#film[data-story="8"] .rabbit-big,#film[data-story="8"] .clue{opacity:1}#film[data-story="9"] .rabbit-big,#film[data-story="9"] .fly-a,#film[data-story="9"] .fly-b{opacity:1}#film[data-story="10"] .bamboo-wall,#film[data-story="10"] .rabbit-big,#film[data-story="10"] .fly-a,#film[data-story="10"] .fly-b{opacity:1}#film[data-story="11"] .lake-ripple,#film[data-story="11"] .moon-door,#film[data-story="11"] .rabbit-big{opacity:1}@keyframes bamboo{50%{transform:rotate(3deg) translateY(-7px)}}@keyframes rabbit{50%{transform:translateY(-12px) rotate(4deg)}}@keyframes spin{50%{transform:rotate(180deg) scale(1.2)}}@keyframes fly{50%{transform:translate(18vw,-12vh) scale(1.3)}}@keyframes ripple{50%{transform:scale(1.18)}}@keyframes door{50%{transform:scale(1.08);filter:drop-shadow(0 0 60px #fff1a8)}}
  </style>`);
  function type(){ if(cursor<text.length){ caption.textContent+=text[cursor++]; timer=setTimeout(type,/[,….!?]/.test(text[cursor-1])?150:36); } else typing=false; }
  function render(){ clearTimeout(timer); const [who,line]=story[index]; film.dataset.story=index; sceneNo.textContent=`${index+1} / ${story.length}`; progress.style.width=`${(index+1)/story.length*100}%`; frames.forEach((f,i)=>f.classList.toggle('active',i===index)); if(index>=6)film.classList.add('chapter2-on');else film.classList.remove('chapter2-on'); captionBox.classList.toggle('character-speaking',who!=='Người kể chuyện'); bubbleAn.classList.remove('show');bubbleRabbit.classList.remove('show'); if(who==='An'){bubbleAn.textContent=line;bubbleAn.classList.add('show')} if(who==='Thỏ Ngọc'){bubbleRabbit.textContent=line;bubbleRabbit.classList.add('show')} caption.textContent='';text=line;cursor=0;typing=true;type(); }
  function next(){ if(!started)return; if(typing){clearTimeout(timer);caption.textContent=text;cursor=text.length;typing=false;return} if(index<story.length-1){index++;render()} else document.querySelector('#finish').classList.add('show'); }
  function begin(){ if(started)return;started=true;start.classList.add('hide');render(); }
  document.querySelector('#begin').addEventListener('click',begin); document.querySelector('#begin').addEventListener('pointerdown',e=>{e.preventDefault();begin()}); film.addEventListener('click',e=>{if(e.target.closest('button,input,.start,.finish'))return;next()}); document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();next()}});
})();

</script></body></html>
