<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mặt Trăng Bị Đánh Cắp — Chương 1</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Playfair+Display:wght@700&display=swap');
:root{--gold:#ffd56f;--cream:#fff7e8;--night:#07091c}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--night);color:var(--cream);font-family:'Be Vietnam Pro',sans-serif}button{font:inherit;cursor:pointer}
#film{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 80% 18%,#32396d,#161b42 45%,#080a20 100%);isolation:isolate;transition:background 1s}.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.3px),radial-gradient(#ffe6a3 1px,transparent 1.3px);background-size:93px 93px,137px 137px;background-position:17px 21px,61px 53px;opacity:.65;animation:twinkle 4s ease-in-out infinite alternate}.moon{position:absolute;z-index:4;right:11%;top:11%;width:clamp(135px,19vw,230px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 31% 27%,#fffef1,#ffe7a1 67%,#eab05f);box-shadow:0 0 45px #fff0b0,0 0 130px #ffd57766;animation:moonFloat 5s ease-in-out infinite}.moon:after{content:"";position:absolute;width:22%;height:12%;left:26%;top:23%;border-radius:50%;background:#d6ad6c55;box-shadow:58px 52px 0 10px #d6ad6c33,22px 98px 0 4px #d6ad6c44}
.ground{position:absolute;z-index:2;left:-3%;right:-3%;bottom:-7%;height:43%;border-radius:50% 50% 0 0/17% 17% 0 0;background:#060819;transition:1s}.houses{position:absolute;z-index:5;inset:0}.house{position:absolute;bottom:17%;width:165px;height:96px;background:#11152f;transition:filter .8s}.house:before{content:"";position:absolute;left:-23px;top:-50px;border-left:106px solid transparent;border-right:106px solid transparent;border-bottom:62px solid #1d2143}.window{position:absolute;left:70px;top:42px;width:22px;height:31px;background:#ffc45d;box-shadow:0 0 24px #ffb340;transition:opacity .8s}.h1{left:4%}.h2{left:39%;transform:scale(.72)}.h3{right:3%;transform:scale(.98)}.star-lamp{position:absolute;z-index:3;right:18px;top:-17px;font-size:25px;color:#ff5e4e;filter:drop-shadow(0 0 10px #ff7a52);opacity:0;transition:opacity .7s}.star-lamp:before{content:"★"}
.bamboo{position:absolute;z-index:6;right:10%;bottom:18%;width:270px;height:330px;transform-origin:bottom center;animation:bambooSway 5s ease-in-out infinite}.stem{position:absolute;bottom:0;width:9px;height:100%;border-radius:9px;background:repeating-linear-gradient(to bottom,transparent 0 43px,#0c2a20 44px 48px,transparent 49px 87px),linear-gradient(90deg,#103326,#559868,#173f2e);box-shadow:0 0 8px #5db87944}.s1{left:8px;transform:rotate(-5deg)}.s2{left:55px;height:90%;transform:rotate(2deg)}.s3{left:105px;height:78%;transform:rotate(8deg)}.s4{left:155px;height:96%;transform:rotate(-3deg)}.s5{left:205px;height:72%;transform:rotate(10deg)}.leaf{position:absolute;width:54px;height:16px;border-radius:100% 0;background:linear-gradient(135deg,#3a8150,#205c3d)}.l1{left:-12px;top:60px;transform:rotate(-28deg)}.l2{left:53px;top:107px;transform:rotate(20deg)}.l3{left:108px;top:150px;transform:rotate(-18deg)}.l4{left:155px;top:72px;transform:rotate(23deg)}.l5{left:203px;top:177px;transform:rotate(-15deg)}
.actors{position:absolute;z-index:10;left:13%;bottom:15%;opacity:0;transition:opacity .6s,transform .8s}.an{position:relative;text-align:center;filter:drop-shadow(0 8px 5px #0009)}.an-face{display:block;font-size:clamp(4.5rem,8vw,7rem)}.name{font-size:.72rem;background:#0a0d25cc;border:1px solid #fff3;border-radius:99px;padding:4px 10px}.speech{position:absolute;left:50%;bottom:calc(100% + 18px);transform:translateX(-50%) translateY(10px) scale(.9);width:max-content;max-width:min(340px,70vw);padding:13px 16px;border:2px solid var(--gold);border-radius:19px 19px 19px 5px;background:#fff8e9;color:#28192c;box-shadow:0 10px 30px #0007;line-height:1.45;font-size:.86rem;opacity:0;transition:.35s}.speech:after{content:"";position:absolute;left:28px;bottom:-10px;border:10px solid transparent;border-top-color:#fff8e9;border-bottom:0}.speech.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.scene{position:absolute;z-index:8;inset:0;opacity:0;pointer-events:none;transition:opacity .75s}.scene.active{opacity:1}.lion{position:absolute;left:-10%;bottom:24%;font-size:clamp(4rem,8vw,7rem);filter:drop-shadow(0 5px 7px #0008)}.drummer{position:absolute;left:-18%;bottom:20%;font-size:clamp(3rem,6vw,5rem)}.kids{position:absolute;left:-28%;bottom:18%;font-size:clamp(2.5rem,5vw,4.5rem)}.cake{position:absolute;left:28%;bottom:26%;font-size:3.5rem;filter:drop-shadow(0 0 13px #ffb65a)}.chair{position:absolute;left:39%;bottom:20%;font-size:4rem;opacity:.65}.shock-ring{position:absolute;right:15%;top:17%;width:130px;height:130px;border:4px dotted #aeb8ff;border-radius:50%;opacity:0}.firefly{position:absolute;left:16%;bottom:25%;font-size:28px;color:#fff19a;text-shadow:0 0 10px #ffe070,0 0 28px #ffd45c}.forest{position:absolute;z-index:6;right:-2%;bottom:9%;width:42%;height:55%;opacity:0;transition:opacity 1s;background:repeating-linear-gradient(88deg,transparent 0 28px,#153c2c 30px 37px,transparent 39px 59px);clip-path:polygon(0 100%,8% 38%,16% 100%,25% 17%,33% 100%,45% 30%,54% 100%,66% 8%,76% 100%,87% 25%,100% 100%);filter:drop-shadow(0 0 16px #255b3e)}
.caption{position:absolute;z-index:30;left:50%;bottom:5%;transform:translateX(-50%);width:min(920px,88vw);text-align:center;font-size:clamp(1rem,2vw,1.3rem);line-height:1.7;text-shadow:0 2px 8px #000,0 0 14px #000;min-height:70px;pointer-events:none}.caption.hidden{display:none}.cursor{display:inline-block;width:2px;height:1.2em;margin-left:3px;vertical-align:middle;background:var(--gold);animation:blink .7s steps(1) infinite}.top{position:absolute;z-index:40;left:25px;right:25px;top:20px;display:flex;justify-content:space-between;color:var(--gold);font-size:.75rem;font-weight:700;letter-spacing:.13em}.progress{position:absolute;z-index:40;left:25px;right:25px;top:60px;height:3px;background:#ffffff22}.progress i{display:block;height:100%;width:0;background:var(--gold);transition:width .6s}
.intro,.end{position:absolute;z-index:100;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 68% 20%,#353c76,#131735 48%,#060819);transition:opacity .8s}.intro.hide{opacity:0;pointer-events:none}.card{width:min(720px,90vw)}.card small{color:var(--gold);letter-spacing:.2em}.card h1,.end h2{font-family:'Playfair Display',serif;font-size:clamp(3.5rem,9vw,7rem);line-height:.9;color:var(--gold);margin:20px 0}.card p{color:#d8cfdd;line-height:1.8}.start-btn{border:0;border-radius:99px;padding:14px 23px;background:linear-gradient(100deg,var(--gold),#ff9e79);color:#28182b;font-weight:700}.countdown{position:absolute;z-index:110;inset:0;display:none;place-items:center;background:#060819e8;text-align:center;color:var(--gold);font:700 clamp(5rem,18vw,12rem) 'Playfair Display',serif}.countdown.show{display:grid}.countdown small{display:block;font:600 .72rem 'Be Vietnam Pro',sans-serif;color:white;letter-spacing:.2em}.end{display:none}.end.show{display:grid}.end h2{font-size:clamp(3rem,7vw,5.5rem)}
#film[data-frame="0"] .actors{opacity:0}#film[data-frame="1"] .actors{opacity:0}#film[data-frame="1"] .star-lamp{opacity:1;animation:lampOn 1.6s ease-in-out infinite}#film[data-frame="1"] .lion{animation:parade 5s linear infinite}#film[data-frame="1"] .drummer{animation:parade 5s .2s linear infinite}#film[data-frame="1"] .kids{animation:parade 5s .4s linear infinite}#film[data-frame="2"] .actors{opacity:1;animation:anHug 2s ease-in-out infinite}#film[data-frame="2"] .cake,#film[data-frame="2"] .chair{animation:softFloat 2.5s ease-in-out infinite}#film[data-frame="2"] .star-lamp{opacity:1}#film[data-frame="3"] .actors{opacity:1;animation:anShock .55s ease-in-out 2}#film[data-frame="3"] .moon{animation:moonVanish 2s ease forwards}#film[data-frame="3"] .shock-ring{animation:ringFade 2s ease forwards}#film[data-frame="3"] .star-lamp{opacity:1}#film[data-frame="4"] .actors{opacity:1;animation:anStagger 1.2s ease both}#film[data-frame="4"] .moon{opacity:0}#film[data-frame="4"] .shock-ring{opacity:.55}#film[data-frame="4"] .star-lamp{opacity:1}#film[data-frame="5"] .actors{opacity:1;animation:anWalk 2.2s ease-in-out infinite}#film[data-frame="5"] .moon,#film[data-frame="5"] .star-lamp,#film[data-frame="5"] .window{opacity:0}#film[data-frame="5"] .bamboo{opacity:0}#film[data-frame="5"] .forest{opacity:1}#film[data-frame="5"] .firefly{animation:fireflyToForest 4s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes twinkle{to{opacity:.35}}@keyframes moonFloat{50%{transform:translateY(-10px)}}@keyframes bambooSway{50%{transform:rotate(1.5deg)}}@keyframes lampOn{50%{filter:drop-shadow(0 0 25px #ff805e);transform:scale(1.12)}}@keyframes parade{0%{transform:translateX(0) translateY(0)}25%{transform:translateX(30vw) translateY(-10px)}50%{transform:translateX(60vw) translateY(0)}75%{transform:translateX(90vw) translateY(-8px)}100%{transform:translateX(125vw)}}@keyframes anHug{50%{transform:scale(1.06) translateY(-7px)}}@keyframes softFloat{50%{transform:translateY(-8px)}}@keyframes anShock{25%{transform:translateX(-10px)}50%{transform:translateX(10px)}75%{transform:translateX(-5px)}}@keyframes moonVanish{0%{opacity:1;transform:translateY(0) scale(1)}55%{opacity:.75;transform:translateY(-20px) scale(.98)}100%{opacity:0;transform:translateY(-70px) scale(.9)}}@keyframes ringFade{30%{opacity:.8;transform:scale(.8)}100%{opacity:0;transform:scale(1.25)}}@keyframes anStagger{45%{transform:translateX(-15px) rotate(-3deg)}75%{transform:translateX(4px)}}@keyframes anWalk{50%{transform:translateX(35px)}}@keyframes fireflyToForest{0%{transform:translate(0,0) scale(.7);opacity:.2}20%{transform:translate(16vw,-6vh);opacity:1}40%{transform:translate(34vw,1vh);opacity:.4}60%{transform:translate(52vw,-9vh);opacity:1}80%{transform:translate(66vw,-2vh);opacity:.55}100%{transform:translate(75vw,-10vh);opacity:1}}@keyframes blink{50%{opacity:0}}
@media(max-width:680px){.bamboo{right:-4%;transform:scale(.68);transform-origin:bottom right}.house{transform:scale(.65)}.h2{left:35%}.h3{right:-4%}.actors{left:5%;bottom:19%}.caption{bottom:8%;width:92vw}.speech{max-width:220px;font-size:.75rem}.forest{width:55%}}
</style>
</head>
<body><main id="film"><div class="stars"></div><div class="moon"></div><div class="ground"></div><div class="houses"><div class="house h1"><i class="star-lamp"></i><i class="window"></i></div><div class="house h2"><i class="star-lamp"></i><i class="window"></i></div><div class="house h3"><i class="star-lamp"></i><i class="window"></i></div></div><div class="bamboo"><i class="stem s1"></i><i class="stem s2"></i><i class="stem s3"></i><i class="stem s4"></i><i class="stem s5"></i><i class="leaf l1"></i><i class="leaf l2"></i><i class="leaf l3"></i><i class="leaf l4"></i><i class="leaf l5"></i></div><div class="forest"></div><div class="actors"><div class="an"><div class="speech" id="speech"></div><span class="an-face">👧🏻</span><span class="name">An</span></div></div><div class="scene scene-0"></div><div class="scene scene-1"><i class="lion">🦁</i><i class="drummer">🥁</i><i class="kids">🏃🏻‍♀️🏃🏻</i></div><div class="scene scene-2"><i class="cake">🥮</i><i class="chair">🪑</i></div><div class="scene scene-3"><i class="shock-ring"></i></div><div class="scene scene-4"><i class="shock-ring"></i></div><div class="scene scene-5"><i class="firefly">✦</i></div><div class="top"><span>✦ TRUNG THU · CHƯƠNG 1</span><span id="counter">1 / 6</span></div><div class="progress"><i id="progress"></i></div><div class="caption" id="captionBox"><span id="caption"></span><i class="cursor"></i></div><section class="intro" id="intro"><div class="card"><small>MỘT BỘ PHIM HOẠT HÌNH TƯƠNG TÁC</small><h1>Mặt Trăng<br>Bị Đánh Cắp</h1><p>Chương 1 — Đêm không trăng<br>Bấm màn hình hoặc nhấn Space để kể tiếp.</p><button class="start-btn" id="start">Bắt đầu Chương 1</button></div></section><div class="countdown" id="countdown"><div><span id="count">5</span><small>CÂU CHUYỆN SẮP BẮT ĐẦU</small></div></div><section class="end" id="end"><div class="card"><h2>Chương 1 kết thúc</h2><p>An bước theo đom đóm vào rừng tre.</p><button class="start-btn" onclick="location.reload()">Xem lại</button></div></section></main>
<script>
const story=[{who:'narrator',text:'Mọi năm, cứ đến đêm rằm tháng Tám, mặt trăng lại treo trên ngọn tre đầu làng.'},{who:'narrator',text:'Đèn ông sao sáng đỏ những con ngõ. Tiếng trống lân chạy từ đầu làng đến tận bờ sông.'},{who:'an',text:'Em sẽ để dành chiếc bánh đẹp nhất cho anh Hai. Năm nay anh nhất định sẽ về.'},{who:'narrator',text:'Nhưng đúng lúc tiếng trống vang lên lần thứ ba… bầu trời bỗng im bặt.'},{who:'an',text:'Mặt trăng… biến mất rồi!'},{who:'narrator',text:'Những chiếc đèn lần lượt tắt. Trên mặt đất chỉ còn một đốm đom đóm dẫn về phía rừng tre.'}];
const film=document.querySelector('#film'),caption=document.querySelector('#caption'),captionBox=document.querySelector('#captionBox'),speech=document.querySelector('#speech'),counter=document.querySelector('#counter'),progress=document.querySelector('#progress'),intro=document.querySelector('#intro'),countdown=document.querySelector('#countdown');let index=0,typing=false,pos=0,current='',timer=null,started=false,ready=false;
function type(){if(pos<current.length){const target=story[index].who==='an'?speech:caption;target.textContent+=current[pos++];timer=setTimeout(type,/[,….!?]/.test(current[pos-1])?150:38)}else typing=false}
function render(){clearTimeout(timer);const item=story[index];film.dataset.frame=index;document.querySelectorAll('.scene').forEach((s,i)=>s.classList.toggle('active',i===index));counter.textContent=`${index+1} / ${story.length}`;progress.style.width=`${(index+1)/story.length*100}%`;caption.textContent='';speech.textContent='';captionBox.classList.toggle('hidden',item.who==='an');speech.classList.toggle('show',item.who==='an');current=item.text;pos=0;typing=true;type()}
function next(){if(!ready)return;if(typing){clearTimeout(timer);const target=story[index].who==='an'?speech:caption;target.textContent=current;pos=current.length;typing=false;return}if(index<story.length-1){index++;render()}else document.querySelector('#end').classList.add('show')}
function begin(e){e.stopPropagation();if(started)return;started=true;intro.classList.add('hide');countdown.classList.add('show');let left=5;document.querySelector('#count').textContent=left;const tick=setInterval(()=>{left--;if(left>0)document.querySelector('#count').textContent=left;else{clearInterval(tick);countdown.classList.remove('show');ready=true;render()}},1000)}
document.querySelector('#start').addEventListener('click',begin);film.addEventListener('click',e=>{if(e.target.closest('button,.intro,.end'))return;next()});document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();if(!started)begin(e);else next()}});
</script></body></html>
